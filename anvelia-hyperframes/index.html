<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anvelia Opening HyperFrames</title>
  </head>
  <body>
    <div
      id="anvelia-opening-show"
      data-composition-id="anvelia-opening-show"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      data-track-index="0"
    >
      <div class="layer opening-layer" data-layout-ignore>
        <img src="assets/anvelia-opening-logo-hero.png" alt="" />
      </div>

      <div class="layer mist-layer" data-layout-ignore>
        <img src="assets/anvelia-mist-forest-transition.png" alt="" />
      </div>

      <div class="layer hero-layer" data-layout-ignore>
        <img src="assets/anvelia-hero-banner.png" alt="" />
      </div>

      <div class="ambient-wash" data-layout-ignore></div>

      <div class="scene-content">
        <div class="hero-title" aria-label="Anvelia Sanctuary">
          <p class="eyebrow">Anvelia Sanctuary</p>
          <h1>A different<br />rhythm of living.</h1>
          <p class="tagline zh">回归身体原本的节律</p>
          <p class="hero-copy">
            Anvélia brings together longevity village living, natural healing,
            detox wellness, mindful retreat, organic cultivation, and slow travel.
          </p>
        </div>
      </div>

      <style>
        :root {
          --forest: #183d2d;
          --gold: #c69b4f;
          --mist: #edf2e6;
          --ink: #13261e;
          --cream: #fbf6e8;
          --shadow: rgba(22, 39, 31, 0.3);
        }

        * {
          box-sizing: border-box;
        }

        html,
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          overflow: hidden;
          background: var(--mist);
        }

        [data-composition-id="anvelia-opening-show"] {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          isolation: isolate;
          background: var(--mist);
          color: var(--cream);
          font-family: Georgia, "Times New Roman", serif;
        }

        .layer,
        .ambient-wash {
          position: absolute;
          inset: 0;
        }

        .layer {
          z-index: 1;
          will-change: opacity, transform, filter;
        }

        .layer img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center;
          transform: translateZ(0);
        }

        .opening-layer {
          opacity: 1;
        }

        .mist-layer,
        .hero-layer {
          opacity: 0;
        }

        .hero-layer img {
          filter: brightness(0.9) saturate(0.96) contrast(0.94);
        }

        .ambient-wash {
          z-index: 2;
          pointer-events: none;
          background:
            radial-gradient(circle at 50% 44%, rgba(251, 246, 232, 0.18), transparent 30%),
            linear-gradient(90deg, rgba(12, 29, 22, 0.24), rgba(237, 242, 230, 0.04) 44%, rgba(12, 29, 22, 0.22)),
            linear-gradient(0deg, rgba(10, 25, 19, 0.42), rgba(39, 57, 47, 0.06) 50%, rgba(237, 242, 230, 0.18));
          opacity: 0.58;
          mix-blend-mode: multiply;
          will-change: opacity, transform;
        }

        .scene-content {
          position: relative;
          z-index: 3;
          display: flex;
          width: 100%;
          height: 100%;
          padding: 118px 150px 132px;
          align-items: center;
          justify-content: center;
        }

        .hero-title {
          width: 860px;
          max-width: 860px;
          text-align: center;
          text-shadow: 0 14px 38px var(--shadow), 0 2px 8px rgba(6, 21, 15, 0.24);
          will-change: opacity, transform;
        }

        .eyebrow {
          margin: 0 0 26px;
          color: rgba(251, 246, 232, 0.88);
          font-family: Arial, Helvetica, sans-serif;
          font-size: 16px;
          font-weight: 700;
          letter-spacing: 0.34em;
          line-height: 1.3;
          text-transform: uppercase;
        }

        h1 {
          margin: 0;
          color: var(--cream);
          font-size: 92px;
          font-weight: 500;
          letter-spacing: 0;
          line-height: 1.08;
        }

        .tagline {
          display: block;
          width: 540px;
          max-width: 540px;
          margin: 34px auto 0;
          color: rgba(251, 246, 232, 0.88);
          font-family: Arial, Helvetica, sans-serif;
          font-size: 22px;
          line-height: 1.55;
        }

        .tagline.zh {
          color: rgba(251, 246, 232, 0.88);
          font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
          font-size: 22px;
          letter-spacing: 0.12em;
        }

        .hero-copy {
          width: 610px;
          max-width: 610px;
          margin: 30px auto 0;
          color: rgba(251, 246, 232, 0.72);
          font-family: Arial, Helvetica, sans-serif;
          font-size: 20px;
          line-height: 1.85;
        }
      </style>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({
          paused: true,
          defaults: { ease: "none" },
        });

        gsap.set(".opening-layer", {
          opacity: 1,
          scale: 1,
          filter: "blur(0px) saturate(1)",
        });
        gsap.set(".mist-layer", {
          opacity: 0,
          scale: 1.04,
          filter: "blur(10px) saturate(0.92)",
        });
        gsap.set(".hero-layer", {
          opacity: 0,
          scale: 1.08,
          filter: "blur(18px) saturate(0.88)",
        });
        gsap.set(".ambient-wash", { opacity: 0.2, scale: 1.01 });
        gsap.set(".hero-title", { opacity: 1, y: 38 });
        gsap.set(".hero-title .eyebrow, .hero-title h1, .hero-title .tagline, .hero-title .hero-copy", {
          opacity: 0,
          y: 24,
        });

        tl
          .addLabel("opening", 0)
          .to(".opening-layer", { scale: 1.035, duration: 2.6 }, "opening")
          .to(".ambient-wash", { opacity: 0.28, duration: 1.4 }, "opening")
          .addLabel("mist-bridge", 2.2)
          .to(".mist-layer", { opacity: 0.92, scale: 1.01, filter: "blur(2px) saturate(1)", duration: 2.2 }, "mist-bridge")
          .to(".opening-layer", { opacity: 0.42, filter: "blur(6px) saturate(0.9)", duration: 2.4 }, "mist-bridge+=0.4")
          .to(".ambient-wash", { opacity: 0.42, duration: 1.8 }, "mist-bridge+=0.2")
          .addLabel("hero-reveal", 4.8)
          .to(".hero-layer", { opacity: 1, scale: 1.02, filter: "blur(7px) saturate(0.96)", duration: 2 }, "hero-reveal")
          .to(".opening-layer", { opacity: 0, scale: 1.08, duration: 1.8 }, "hero-reveal+=0.5")
          .to(".mist-layer", { opacity: 0.34, filter: "blur(12px) saturate(0.84)", duration: 2.2 }, "hero-reveal+=1.2")
          .to(".ambient-wash", { opacity: 0.58, scale: 1, duration: 1.8 }, "hero-reveal+=0.8")
          .addLabel("clarity", 6.8)
          .to(".hero-layer", { scale: 1, filter: "blur(0px) saturate(1.02)", duration: 2 }, "clarity")
          .to(".mist-layer", { opacity: 0, duration: 1.6 }, "clarity+=0.5")
          .addLabel("title", 7.8)
          .to(".hero-title", { y: 0, duration: 1.4, ease: "power2.out" }, "title")
          .to(
            ".hero-title .eyebrow, .hero-title h1, .hero-title .tagline, .hero-title .hero-copy",
            { opacity: 1, y: 0, duration: 1.35, stagger: 0.12, ease: "power2.out" },
            "title+=0.05"
          )
          .to(".hero-layer", { scale: 1.008, duration: 2.2 }, "title+=0.2")
          .addLabel("hold", 10);

        window.__timelines["anvelia-opening-show"] = tl;

        const seekParam = new URLSearchParams(window.location.search).get("seek");
        if (seekParam !== null) {
          const seekTime = Number(seekParam);
          if (Number.isFinite(seekTime)) {
            tl.time(Math.max(0, Math.min(10, seekTime)));
          }
        }
      </script>
    </div>
  </body>
</html>
